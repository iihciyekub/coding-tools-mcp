name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop-client/**"
      - ".github/workflows/desktop.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/desktop-client/**"
      - ".github/workflows/desktop.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: apps/desktop-client/src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo test
