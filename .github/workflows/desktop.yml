name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop-client/**"
      - "coding_tools_mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/desktop-client/**"
      - "coding_tools_mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  check:
    name: Check (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend and bounded runtime source payload
        run: npm run build:bundle

      - name: Check Rust formatting
        working-directory: apps/desktop-client/src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo test

      - name: Prepare and reuse an external runtime
        working-directory: apps/desktop-client/src-tauri
        run: cargo test prepare_and_reuse_external_runtime -- --ignored

      - name: Verify pinned macOS managed downloads
        working-directory: apps/desktop-client/src-tauri
        run: cargo test downloads_and_verifies_pinned_macos_tools -- --ignored

      - name: Prepare an external runtime without uv
        working-directory: apps/desktop-client/src-tauri
        run: cargo test prepare_external_runtime_without_uv -- --ignored
