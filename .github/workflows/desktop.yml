name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop-client/**"
      - "coding_tools_mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_browser_control.py"
      - "tests/browser_bridge.test.cjs"
      - "tests/test_macos_app_helper.py"
      - ".github/workflows/desktop.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/desktop-client/**"
      - "coding_tools_mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/test_browser_control.py"
      - "tests/browser_bridge.test.cjs"
      - "tests/test_macos_app_helper.py"
      - ".github/workflows/desktop.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-client
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend and bounded runtime source payload
        run: npm run build:bundle

      - name: Check Rust formatting
        working-directory: apps/desktop-client/src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/desktop-client/src-tauri
        run: cargo test

      - name: Prepare and reuse an external runtime
        working-directory: apps/desktop-client/src-tauri
        run: cargo test prepare_and_reuse_external_runtime -- --ignored

      - name: Verify pinned macOS managed downloads
        if: runner.os == 'macOS'
        working-directory: apps/desktop-client/src-tauri
        run: cargo test downloads_and_verifies_pinned_macos_tools -- --ignored

      - name: Prepare an external runtime without uv
        if: runner.os != 'Windows'
        working-directory: apps/desktop-client/src-tauri
        run: cargo test prepare_external_runtime_without_uv -- --ignored

      - name: Check Chrome bridge regressions
        working-directory: .
        run: uv run python -m unittest tests.test_browser_control

      - name: Check macOS app helper delegation
        working-directory: .
        run: uv run python -m unittest tests.test_macos_app_helper

      - name: Check extension execution and deadlines
        working-directory: .
        run: node --test tests/browser_bridge.test.cjs
