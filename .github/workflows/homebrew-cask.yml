name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Desktop release tag
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop release tag, for example desktop-v0.3.21
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-cask:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'desktop-v')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Resolve desktop release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-v}"
          asset="Coding-Tools-MCP-${version}-arm64.dmg"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
          curl --fail --location --retry 3 --output "/tmp/${asset}" "$url"
          sha256="$(sha256sum "/tmp/${asset}" | awk '{print $1}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Configure Homebrew tap deploy key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Update Cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git clone git@github.com:iihciyekub/homebrew-tap.git tap
          mkdir -p tap/Casks
          cat > tap/Casks/coding-tools-mcp.rb <<EOF
          cask "coding-tools-mcp" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/iihciyekub/coding-tools-mcp/releases/download/desktop-v#{version}/Coding-Tools-MCP-#{version}-arm64.dmg"
            name "Coding Tools MCP"
            desc "Manage Coding Tools MCP workspaces and local agent runtimes"
            homepage "https://github.com/iihciyekub/coding-tools-mcp"

            depends_on arch: :arm64
            depends_on :macos

            app "Coding Tools MCP.app"
          end
          EOF
          cd tap
          if git diff --quiet -- Casks/coding-tools-mcp.rb; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "coding-tools-mcp-release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/coding-tools-mcp.rb
          git commit -m "Update Coding Tools MCP cask to ${VERSION}"
          git push origin HEAD:main

  verify-cask:
    name: Verify Homebrew install
    needs: update-cask
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Tap maintained repository
        shell: bash
        run: |
          set -euo pipefail
          brew tap iihciyekub/tap

      - name: Validate, fetch and install Cask
        shell: bash
        run: |
          set -euo pipefail
          brew style --cask iihciyekub/tap/coding-tools-mcp
          brew info --cask iihciyekub/tap/coding-tools-mcp
          brew fetch --cask iihciyekub/tap/coding-tools-mcp
          brew install --cask iihciyekub/tap/coding-tools-mcp
          test -d "/Applications/Coding Tools MCP.app"

      - name: Verify installed version, signature and launch
        shell: bash
        run: |
          set -euo pipefail
          app="/Applications/Coding Tools MCP.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$version" = "${RELEASE_TAG#desktop-v}"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          python3 - <<'PY'
          import subprocess
          process = subprocess.Popen(['/Applications/Coding Tools MCP.app/Contents/MacOS/coding-tools-mcp-desktop'])
          try:
              try:
                  code = process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  print('Installed desktop app stayed running after launch.')
              else:
                  raise RuntimeError(f'Desktop app exited during startup: {code}')
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          PY

      - name: Remove verification install
        if: always()
        shell: bash
        run: brew uninstall --cask coding-tools-mcp >/dev/null 2>&1 || true
