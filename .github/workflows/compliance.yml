name: compliance

on:
  push:
    branches: [main, "recover-*", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
  workflow_call:

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install runtime and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lint
        run: make lint

      - name: Run typecheck
        run: make typecheck

      - name: Run unit discovery
        run: make test

      - name: Run protocol gate
        run: make test-protocol

      - name: Run integration gate
        run: make test-integration

      - name: Run required docs gate
        run: make test-docs-required

      - name: Run schema drift gate
        run: make test-schema-drift

      - name: Run npm launcher gate
        run: make check-npm-launcher

      - name: Enforce MCP tool surface budget
        run: make check-tool-surface

      - name: Run dogfood smoke
        run: make dogfood-smoke

      - name: Run latency benchmark
        run: make benchmark-latency

      - name: Validate SWE-bench smoke preflight
        run: make benchmark-smoke

      - name: Refresh full compliance report
        run: make compliance

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compliance-evidence
          path: |
            reports/compliance/**
            reports/benchmark/**
            reports/dogfood/**
            docs/dogfood/**
          if-no-files-found: ignore
          retention-days: 14

  macos-runtime-smoke:
    name: macOS runtime smoke
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Probe Apple toolchain
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from coding_tools_mcp.apple_toolchain import probe

          info = probe(cwd=Path.cwd(), env=dict(os.environ), include_sdks=False)
          assert info["is_macos"], info
          assert info["xcrun"], info
          assert info["swift_available"], info
          assert info["sourcekit_lsp"], info
          print(info)
          PY

      - name: Run macOS-specific runtime tests
        run: |
          python -m unittest \
            tests.test_workflow_tools.WorkflowToolTests.test_swift_lsp_uses_package_root_and_xcrun_discovery \
            tests.test_workflow_tools.WorkflowToolTests.test_apple_workspace_metadata_and_checks_are_cli_first \
            tests.test_check_diagnostics.CheckDiagnosticsTests.test_parses_apple_toolchain_failures \
            tests.compliance.test_runtime_helpers.RuntimeHelperTests.test_runtime_doctor_reports_python_alias_and_network_policy
