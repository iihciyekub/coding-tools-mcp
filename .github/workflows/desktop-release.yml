name: Desktop Release

# Canonical maintainer/agent entry point for an existing desktop tag:
#   gh workflow run desktop-release.yml \
#     -R iihciyekub/coding-tools-mcp \
#     --ref iiaide \
#     -f tag=desktop-v<version> \
#     -f mode=release
# A newly pushed desktop-v<version> tag runs the same full release path
# automatically. See docs/desktop-release-maintenance.md for the release contract.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop release tag for a full release; optional for Windows artifact-only builds
        required: false
        type: string
      mode:
        description: Build mode
        required: true
        default: windows-artifact
        type: choice
        options:
          - windows-artifact
          - release

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref_name }}-${{ github.event_name == 'push' && 'release' || inputs.mode }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desktop release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
      windows: ${{ steps.version.outputs.windows }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - name: Validate desktop version metadata
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          BUILD_MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/desktop-client/package.json').version")"
          if [[ "$BUILD_MODE" == "release" ]]; then
            case "$RELEASE_TAG" in
              desktop-v*) ;;
              *) echo "Full desktop release requires a desktop-v* tag" >&2; exit 1 ;;
            esac
            version="${RELEASE_TAG#desktop-v}"
          else
            version="$package_version"
            RELEASE_TAG="desktop-v${version}"
          fi
          tauri_version="$(python3 -c 'import json; print(json.load(open("apps/desktop-client/src-tauri/tauri.conf.json"))["version"])')"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' apps/desktop-client/src-tauri/Cargo.toml | head -1)"
          app_version="$(sed -n 's/^const APP_VERSION = "\([^"]*\)";/\1/p' apps/desktop-client/src/App.tsx)"
          for pair in "package.json:$package_version" "tauri.conf.json:$tauri_version" "Cargo.toml:$cargo_version" "App.tsx:$app_version"
          do
            name="${pair%%:*}"
            actual="${pair#*:}"
            if [[ "$actual" != "$version" ]]; then
              echo "$name version $actual does not match release version $version" >&2
              exit 1
            fi
          done
          # Platform selection is versioned with the release source. Older tags
          # without this field retain the existing macOS + Windows behavior.
          windows="$(node <<'JS'
          const platforms = require('./apps/desktop-client/package.json').releasePlatforms ?? ['macos', 'windows'];
          if (!Array.isArray(platforms) || !platforms.includes('macos') ||
              platforms.some(value => !['macos', 'windows'].includes(value)) ||
              new Set(platforms).size !== platforms.length) {
            throw new Error('releasePlatforms must contain macos and optionally windows');
          }
          process.stdout.write(String(platforms.includes('windows')));
          JS
          )"
          if [[ "$BUILD_MODE" == "windows-artifact" ]]; then
            windows=true
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64 · sign and notarize
    needs: validate
    if: needs.validate.outputs.mode == 'release'
    runs-on: macos-14
    environment: production-release
    timeout-minutes: 60
    env:
      MAC_CSC_NAME: ${{ vars.MAC_CSC_NAME || 'Yongjian Li (2NLAH5MYH8)' }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        working-directory: apps/desktop-client
        run: npm ci

      - name: Check desktop
        working-directory: apps/desktop-client
        run: npm run check

      - name: Import Developer ID and App Store Connect API key
        shell: bash
        env:
          MAC_CSC_P12_BASE64: ${{ secrets.MAC_CSC_P12_BASE64 }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_P12_BASE64 MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID_SECRET APPLE_API_ISSUER_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing production-release secret::$name is required for a desktop release"
              exit 1
            fi
          done
          [[ -n "$MAC_CSC_NAME" ]] || { echo "::error::MAC_CSC_NAME is required"; exit 1; }

          certificate="$RUNNER_TEMP/coding-tools-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          keychain="$RUNNER_TEMP/coding-tools-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          python3 - "$certificate" "$api_key" <<'PY'
          import base64
          import os
          import pathlib
          import sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["MAC_CSC_P12_BASE64"]))
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"]))
          PY
          chmod 600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "Developer ID Application: $MAC_CSC_NAME"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: $MAC_CSC_NAME" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Build unsigned app bundle
        working-directory: apps/desktop-client
        run: npm run tauri build -- --bundles app --no-sign --ci

      - name: Sign, notarize and staple app
        shell: bash
        working-directory: apps/desktop-client
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/Coding Tools MCP.app"
          app_zip="$RUNNER_TEMP/Coding-Tools-MCP-${{ needs.validate.outputs.version }}.app.zip"
          test -d "$app"
          helper="$app/Contents/Resources/computer/Coding Tools MCP App Helper.app"
          test -d "$helper"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$helper"
          codesign --verify --deep --strict --verbose=2 "$helper"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Create, sign and notarize DMG
        shell: bash
        working-directory: apps/desktop-client
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          app="src-tauri/target/release/bundle/macos/Coding Tools MCP.app"
          dmg="src-tauri/target/release/bundle/dmg/Coding-Tools-MCP-${version}-arm64.dmg"
          bash ./create-dmg.sh "$app" "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=4 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          hdiutil verify "$dmg"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$dmg" "$RUNNER_TEMP/release-assets/"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-macos-arm64
          path: ${{ runner.temp }}/release-assets/Coding-Tools-MCP-${{ needs.validate.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain="${KEYCHAIN_PATH:-$RUNNER_TEMP/coding-tools-release.keychain-db}"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
          rm -f "$RUNNER_TEMP/coding-tools-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 || true

  windows:
    name: Windows x64 · portable ZIP
    needs: validate
    if: needs.validate.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - name: Check out release source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.validate.outputs.mode == 'release' && needs.validate.outputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        working-directory: apps/desktop-client
        run: npm ci

      - name: Check desktop
        working-directory: apps/desktop-client
        run: npm run check

      - name: Build portable executable
        working-directory: apps/desktop-client
        run: npm run tauri build -- --no-bundle --ci

      - name: Assemble portable ZIP
        shell: pwsh
        working-directory: apps/desktop-client
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $binary = "src-tauri\target\release\coding-tools-mcp-desktop.exe"
          $runtime = "src-tauri\target\release\runtime"
          if (-not (Test-Path $runtime)) {
            $runtime = "src-tauri\resources\runtime"
          }
          if (-not (Test-Path $binary)) { throw "Desktop executable not found: $binary" }
          if (-not (Test-Path "$runtime\manifest.json")) { throw "Runtime payload not found: $runtime" }
          $folderName = "Coding-Tools-MCP-$version-win-x64-portable"
          $staging = Join-Path $env:RUNNER_TEMP $folderName
          $outDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $staging, $outDir | Out-Null
          Copy-Item $binary (Join-Path $staging "Coding Tools MCP.exe")
          Copy-Item $runtime (Join-Path $staging "runtime") -Recurse
          @"
          Coding Tools MCP $version — Windows x64 Portable

          Extract this ZIP before running "Coding Tools MCP.exe".
          The application itself is portable; workspace profiles, credentials,
          downloaded tools and managed Python environments are stored in the
          normal per-user application-data / credential locations.
          "@ | Set-Content -Encoding UTF8 (Join-Path $staging "PORTABLE-README.txt")
          $zip = Join-Path $outDir "$folderName.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -CompressionLevel Optimal
          $verify = Join-Path $env:RUNNER_TEMP "portable-verify"
          Expand-Archive -Path $zip -DestinationPath $verify
          if (-not (Test-Path "$verify\Coding Tools MCP.exe")) { throw "Portable ZIP is missing the executable" }
          if (-not (Test-Path "$verify\runtime\manifest.json")) { throw "Portable ZIP is missing runtime resources" }

      - name: Upload Windows portable asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows-x64-portable
          path: ${{ runner.temp }}/release-assets/Coding-Tools-MCP-${{ needs.validate.outputs.version }}-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub desktop release
    needs: [validate, macos, windows]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      needs.validate.outputs.mode == 'release' &&
      needs.macos.result == 'success' &&
      (needs.windows.result == 'success' ||
       (needs.validate.outputs.windows == 'false' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          assets=("Coding-Tools-MCP-${version}-arm64.dmg")
          if [[ "${{ needs.validate.outputs.windows }}" == "true" ]]; then
            assets+=("Coding-Tools-MCP-${version}-win-x64-portable.zip")
          fi
          for asset in "${assets[@]}"; do test -f "release-assets/$asset"; done
          (
            cd release-assets
            sha256sum "${assets[@]}" > SHA256SUMS.txt
          )

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Stable desktop assets are immutable; bump the desktop version instead." >&2
            exit 1
          fi
          assets=("release-assets/Coding-Tools-MCP-${VERSION}-arm64.dmg" "release-assets/SHA256SUMS.txt")
          if [[ "${{ needs.validate.outputs.windows }}" == "true" ]]; then
            assets+=("release-assets/Coding-Tools-MCP-${VERSION}-win-x64-portable.zip")
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Coding Tools MCP Desktop $VERSION" --generate-notes "${assets[@]}"

  homebrew:
    name: Update Homebrew Cask
    needs: [validate, publish]
    if: always() && !cancelled() && needs.validate.outputs.mode == 'release' && needs.publish.result == 'success'
    uses: ./.github/workflows/homebrew-cask.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
