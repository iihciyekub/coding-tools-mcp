name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop release tag for a full release; optional for Windows artifact-only builds
        required: false
        type: string
      mode:
        description: Build mode
        required: true
        default: windows-artifact
        type: choice
        options:
          - windows-artifact
          - release

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref_name }}-${{ github.event_name == 'push' && 'release' || inputs.mode }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desktop release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - name: Validate desktop version metadata
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          BUILD_MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/desktop-client/package.json').version")"
          if [[ "$BUILD_MODE" == "release" ]]; then
            case "$RELEASE_TAG" in
              desktop-v*) ;;
              *) echo "Full desktop release requires a desktop-v* tag" >&2; exit 1 ;;
            esac
            version="${RELEASE_TAG#desktop-v}"
          else
            version="$package_version"
            RELEASE_TAG="desktop-v${version}"
          fi
          tauri_version="$(python3 -c 'import json; print(json.load(open("apps/desktop-client/src-tauri/tauri.conf.json"))["version"])')"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' apps/desktop-client/src-tauri/Cargo.toml | head -1)"
          app_version="$(sed -n 's/^const APP_VERSION = "\([^"]*\)";/\1/p' apps/desktop-client/src/App.tsx)"
          for pair in "package.json:$package_version" "tauri.conf.json:$tauri_version" "Cargo.toml:$cargo_version" "App.tsx:$app_version"
          do
            name="${pair%%:*}"
            actual="${pair#*:}"
            if [[ "$actual" != "$version" ]]; then
              echo "$name version $actual does not match release version $version" >&2
              exit 1
            fi
          done
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64 · sign and notarize
    needs: validate
    if: needs.validate.outputs.mode == 'release'
    runs-on: macos-14
    outputs:
      apple_ready: ${{ steps.apple.outputs.ready }}
    steps:
      - name: Check Apple release credentials
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple release secrets are not configured; cloud macOS signing/notarization is skipped."
          fi

      - name: Check out release tag
        if: steps.apple.outputs.ready == 'true'
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Confirm Apple Silicon runner
        if: steps.apple.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up Node
        if: steps.apple.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        if: steps.apple.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: steps.apple.outputs.ready == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        if: steps.apple.outputs.ready == 'true'
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        if: steps.apple.outputs.ready == 'true'
        working-directory: apps/desktop-client
        run: npm ci

      - name: Check desktop
        if: steps.apple.outputs.ready == 'true'
        working-directory: apps/desktop-client
        run: npm run check

      - name: Import Developer ID certificate
        if: steps.apple.outputs.ready == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/coding-tools-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          python3 - "$certificate" <<'PY'
          import base64
          import os
          import pathlib
          import sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Build unsigned app bundle
        if: steps.apple.outputs.ready == 'true'
        working-directory: apps/desktop-client
        run: npm run tauri build -- --bundles app --no-sign --ci

      - name: Sign, notarize and staple app
        if: steps.apple.outputs.ready == 'true'
        shell: bash
        working-directory: apps/desktop-client
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/Coding Tools MCP.app"
          app_zip="$RUNNER_TEMP/Coding-Tools-MCP-${{ needs.validate.outputs.version }}.app.zip"
          test -d "$app"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Create, sign and notarize DMG
        if: steps.apple.outputs.ready == 'true'
        shell: bash
        working-directory: apps/desktop-client
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          app="src-tauri/target/release/bundle/macos/Coding Tools MCP.app"
          dmg="src-tauri/target/release/bundle/dmg/Coding-Tools-MCP-${version}-arm64.dmg"
          bash ./create-dmg.sh "$app" "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$dmg" "$RUNNER_TEMP/release-assets/"

      - name: Upload macOS release asset
        if: steps.apple.outputs.ready == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-macos-arm64
          path: ${{ runner.temp }}/release-assets/Coding-Tools-MCP-${{ needs.validate.outputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always() && steps.apple.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  windows:
    name: Windows x64 · portable ZIP
    needs: validate
    runs-on: windows-2025
    steps:
      - name: Check out release source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.validate.outputs.mode == 'release' && needs.validate.outputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install runtime packaging tool
        run: python -m pip install uv==0.11.28

      - name: Install frontend dependencies
        working-directory: apps/desktop-client
        run: npm ci

      - name: Check desktop
        working-directory: apps/desktop-client
        run: npm run check

      - name: Build portable executable
        working-directory: apps/desktop-client
        run: npm run tauri build -- --no-bundle --ci

      - name: Assemble portable ZIP
        shell: pwsh
        working-directory: apps/desktop-client
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $binary = "src-tauri\target\release\coding-tools-mcp-desktop.exe"
          $runtime = "src-tauri\target\release\runtime"
          if (-not (Test-Path $runtime)) {
            $runtime = "src-tauri\resources\runtime"
          }
          if (-not (Test-Path $binary)) { throw "Desktop executable not found: $binary" }
          if (-not (Test-Path "$runtime\manifest.json")) { throw "Runtime payload not found: $runtime" }
          $folderName = "Coding-Tools-MCP-$version-win-x64-portable"
          $staging = Join-Path $env:RUNNER_TEMP $folderName
          $outDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $staging, $outDir | Out-Null
          Copy-Item $binary (Join-Path $staging "Coding Tools MCP.exe")
          Copy-Item $runtime (Join-Path $staging "runtime") -Recurse
          @"
          Coding Tools MCP $version — Windows x64 Portable

          Extract this ZIP before running "Coding Tools MCP.exe".
          The application itself is portable; workspace profiles, credentials,
          downloaded tools and managed Python environments are stored in the
          normal per-user application-data / credential locations.
          "@ | Set-Content -Encoding UTF8 (Join-Path $staging "PORTABLE-README.txt")
          $zip = Join-Path $outDir "$folderName.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -CompressionLevel Optimal
          $verify = Join-Path $env:RUNNER_TEMP "portable-verify"
          Expand-Archive -Path $zip -DestinationPath $verify
          if (-not (Test-Path "$verify\Coding Tools MCP.exe")) { throw "Portable ZIP is missing the executable" }
          if (-not (Test-Path "$verify\runtime\manifest.json")) { throw "Portable ZIP is missing runtime resources" }

      - name: Upload Windows portable asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows-x64-portable
          path: ${{ runner.temp }}/release-assets/Coding-Tools-MCP-${{ needs.validate.outputs.version }}-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub desktop release
    needs: [validate, macos, windows]
    if: needs.validate.outputs.mode == 'release' && needs.macos.outputs.apple_ready == 'true' && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7.0.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          test -f "release-assets/Coding-Tools-MCP-${version}-arm64.dmg"
          test -f "release-assets/Coding-Tools-MCP-${version}-win-x64-portable.zip"
          (
            cd release-assets
            sha256sum "Coding-Tools-MCP-${version}-arm64.dmg" "Coding-Tools-MCP-${version}-win-x64-portable.zip" > SHA256SUMS.txt
          )

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Stable desktop assets are immutable; bump the desktop version instead." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Coding Tools MCP Desktop $VERSION" --generate-notes "release-assets/Coding-Tools-MCP-${VERSION}-arm64.dmg" "release-assets/Coding-Tools-MCP-${VERSION}-win-x64-portable.zip" "release-assets/SHA256SUMS.txt"

  homebrew:
    name: Update Homebrew Cask
    needs: [validate, publish]
    if: needs.validate.outputs.mode == 'release' && needs.publish.result == 'success'
    uses: ./.github/workflows/homebrew-cask.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
