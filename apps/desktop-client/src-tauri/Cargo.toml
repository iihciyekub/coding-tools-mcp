[package]
name = "coding-tools-mcp-desktop"
version = "0.3.27"
description = "Cross-platform desktop control plane for Coding Tools MCP"
authors = ["Coding Tools MCP Contributors"]
license = "Apache-2.0"
repository = "https://github.com/xyTom/coding-tools-mcp"
edition = "2021"
rust-version = "1.84"

[lib]
name = "coding_tools_mcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
